<!DOCTYPE html>
<html>
<head>
    <title>Test de Imágenes</title>
</head>
<body>
    <h1>Test de Imágenes - Verifica que aparezcan</h1>
    
    <h2>Imágenes de Profesores:</h2>
    <img src="/images/teacher1.png" alt="teacher1" style="width: 100px; margin: 10px;" />
    <img src="/images/teacher2.png" alt="teacher2" style="width: 100px; margin: 10px;" />
    <img src="/images/teacher3.png" alt="teacher3" style="width: 100px; margin: 10px;" />
    
    <h2>Logo:</h2>
    <img src="/images/logo.png" alt="logo" style="width: 150px; margin: 10px;" />
    
    <p>Si las imágenes no aparecen:</p>
    <ol>
        <li>Coloca tus imágenes en la carpeta: <code>public/images/</code></li>
        <li>Usa exactamente estos nombres: teacher1.png, teacher2.png, teacher3.png, logo.png</li>
        <li>Recarga la página con Ctrl + F5</li>
    </ol>
</body>
</html>
